<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>

    <!-- Top Glow -->
    <radialGradient id="topGlow" cx="256" cy="60" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a3c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="pLeft" x1="150" y1="110" x2="195" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="pRight" x1="317" y1="110" x2="362" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="pDiag" x1="160" y1="110" x2="350" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Core Spark Glow -->
    <filter id="coreGlow" x="180" y="180" width="152" height="152" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientShadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#ambientShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#topGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="26" y="26" width="460" height="460" rx="102" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Left Pillar (Chatbot Cobalt) -->
  <rect x="148" y="110" width="48" height="292" rx="14" fill="url(#pLeft)"/>

  <!-- Right Pillar (World Emerald) -->
  <rect x="316" y="110" width="48" height="292" rx="14" fill="url(#pRight)"/>

  <!-- Diagonal Beam (Anime Amethyst/Crimson) -->
  <polygon points="148,110 208,110 364,402 304,402" fill="url(#pDiag)"/>

  <!-- Central Nexus Core Diamond -->
  <g filter="url(#coreGlow)">
    <polygon points="256,220 292,256 256,292 220,256" fill="#ffffff" fill-opacity="0.95"/>
    <polygon points="256,236 276,256 256,276 236,256" fill="#ffffff"/>
  </g>
</svg>
