<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111422"/>
      <stop offset="50%" stop-color="#0a0b12"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e4e1fe"/>
      <stop offset="70%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#7066e0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8c7ae6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c7b8ea" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5352ed" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a29bfe" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6c5ce7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#darkBg)" stroke="rgba(162, 155, 254, 0.25)" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)"/>

  <!-- Orbital Ring (Behind back half) -->
  <g transform="rotate(-25 256 256)">
    <ellipse cx="256" cy="256" rx="210" ry="58" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Central Four-Point Star Symbol -->
  <path d="M 256,76 Q 256,220 120,256 Q 256,292 256,436 Q 256,292 392,256 Q 256,220 256,76 Z" fill="url(#starGrad)"/>

  <!-- Central Star Facet Highlight -->
  <path d="M 256,76 Q 256,220 120,256 L 256,256 Z" fill="rgba(255, 255, 255, 0.35)"/>
  <path d="M 256,256 Q 256,292 256,436 Q 256,292 392,256 Z" fill="rgba(108, 92, 231, 0.25)"/>

  <!-- Orbital Ring (Foreground overlap slice) -->
  <g transform="rotate(-25 256 256)">
    <path d="M 46,256 A 210 58 0 0 0 320 300" fill="none" stroke="url(#ringGrad)" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- Companion Sparkles -->
  <path d="M 148,132 Q 148,150 130,150 Q 148,150 148,168 Q 148,150 166,150 Q 148,150 148,132 Z" fill="#dcdde1" opacity="0.85"/>
  <path d="M 374,332 Q 374,346 360,346 Q 374,346 374,360 Q 374,346 388,346 Q 374,346 374,332 Z" fill="#dcdde1" opacity="0.85"/>
</svg>