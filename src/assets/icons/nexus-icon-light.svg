<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3f4fa"/>
      <stop offset="100%" stop-color="#e6e8f4"/>
    </linearGradient>
    <linearGradient id="starLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e245a"/>
      <stop offset="40%" stop-color="#372b6b"/>
      <stop offset="80%" stop-color="#4834d4"/>
      <stop offset="100%" stop-color="#686de0"/>
    </linearGradient>
    <linearGradient id="ringLightGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4834d4" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#686de0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lightBg)" stroke="rgba(104, 109, 224, 0.2)" stroke-width="2"/>

  <!-- Orbital Ring (Behind back half) -->
  <g transform="rotate(-25 256 256)">
    <ellipse cx="256" cy="256" rx="210" ry="58" fill="none" stroke="url(#ringLightGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Central Four-Point Star Symbol -->
  <path d="M 256,76 Q 256,220 120,256 Q 256,292 256,436 Q 256,292 392,256 Q 256,220 256,76 Z" fill="url(#starLightGrad)"/>

  <!-- Central Star Facet Highlight -->
  <path d="M 256,76 Q 256,220 120,256 L 256,256 Z" fill="rgba(255, 255, 255, 0.25)"/>
  <path d="M 256,256 Q 256,292 256,436 Q 256,292 392,256 Z" fill="rgba(0, 0, 0, 0.2)"/>

  <!-- Orbital Ring (Foreground overlap slice) -->
  <g transform="rotate(-25 256 256)">
    <path d="M 46,256 A 210 58 0 0 0 320 300" fill="none" stroke="url(#ringLightGrad)" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- Companion Sparkles -->
  <path d="M 148,132 Q 148,150 130,150 Q 148,150 148,168 Q 148,150 166,150 Q 148,150 148,132 Z" fill="#4834d4" opacity="0.75"/>
  <path d="M 374,332 Q 374,346 360,346 Q 374,346 374,360 Q 374,346 388,346 Q 374,346 374,332 Z" fill="#4834d4" opacity="0.75"/>
</svg>