name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run pack:win
          - os: ubuntu-latest
            script: npm run pack:linux
          - os: macos-latest
            script: npm run pack:mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools fakeroot

      - run: npm ci

      - name: Build
        run: ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK and licenses
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_SDK_PATH" > android/local.properties
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "$ANDROID_SDK_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate Release Signing Secrets
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Missing Android Signing Secrets::Production release APK signing requires ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets to be configured in GitHub repository secrets. Embedded fallbacks are forbidden."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Configure signing keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nexus-release.keystore
          chmod 600 android/nexus-release.keystore
          cp android/nexus-release.keystore android/app/nexus-release.keystore
          echo "=== Keystore Verification (Validating Alias without Leaking Secrets) ==="
          keytool -list -keystore android/nexus-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 || {
            echo "::error::Keystore validation failed: unable to open keystore or alias does not match."
            exit 1
          }
          echo "Keystore verified successfully."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build release APK
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease -x lint --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
        env:
          ANDROID_KEYSTORE_PATH: nexus-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Surface build error
        if: failure()
        run: |
          if [ -f "/tmp/gradle.log" ]; then
            echo "::group::Gradle Build Log"
            tail -n 120 /tmp/gradle.log
            echo "::endgroup::"
            ERRORS=$(grep -E 'FAILURE:|Execution failed for task|error:|BUILD FAILED' -A 4 /tmp/gradle.log | head -n 30 | tr '\n' ' ')
            if [ -z "$ERRORS" ]; then
              ERRORS=$(tail -n 20 /tmp/gradle.log | tr '\n' ' ')
            fi
            echo "::error title=Gradle Build Failure::$ERRORS"
          fi

      - name: Report build summary
        if: always()
        run: |
          if [ -f "/tmp/gradle.log" ]; then
            echo "### Gradle Build Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-failure-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          mkdir -p out
          echo "=== Build outputs directory contents ==="
          find android/app/build/outputs -maxdepth 4 || true
          APK_FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "out/Eva-android.apk"
            echo "Successfully collected APK from $APK_FILE to out/Eva-android.apk"
          else
            echo "Error: No APK file was generated by Gradle."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "=== APK Signature Details ==="
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "out/Eva-android.apk" || true
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Secure cleanup of temporary keystore
        if: always()
        run: |
          rm -f android/nexus-release.keystore android/app/nexus-release.keystore
          echo "Temporary keystore file securely destroyed."

  release:
    name: Publish GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
